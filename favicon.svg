<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#pawGradient)" stroke="#2E7D32" stroke-width="1"/>
  
  <!-- Paw print -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Main pad -->
    <ellipse cx="16" cy="20" rx="6" ry="5"/>
    
    <!-- Toe pads -->
    <circle cx="10" cy="12" r="3"/>
    <circle cx="16" cy="10" r="3"/>
    <circle cx="22" cy="12" r="3"/>
    <circle cx="13" cy="8" r="2.5"/>
    <circle cx="19" cy="8" r="2.5"/>
  </g>
  
  <!-- Text -->
  <text x="16" y="28" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#ffffff" text-anchor="middle">AW</text>
</svg>
